version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: disaster_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Optional local PostGIS service if offline or local testing is needed
  postgis:
    image: postgis/postgis:15-3.3
    container_name: disaster_postgis
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: disaster_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
